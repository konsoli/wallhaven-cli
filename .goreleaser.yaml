version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: wallhaven-cli
    binary: wallhaven-cli
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: wallhaven-cli
    ids: [wallhaven-cli]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - COPYING
      - LICENSES/**/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: wallhaven-cli
    binaries: [wallhaven-cli]
    ids: [wallhaven-cli]
    directory: Casks
    homepage: https://github.com/konsoli/wallhaven-cli
    description: Fetch a wallpaper from wallhaven.cc and set it as your desktop wallpaper
    repository:
      owner: konsoli
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_msg_template: "wallhaven-cli {{ .Tag }}"
    hooks:
      post:
        # The release binaries are not signed or notarized, so Gatekeeper
        # would otherwise quarantine them on first run.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/wallhaven-cli"]
          end
    caveats: |
      Run `wallhaven-cli` with no arguments for the full help.

      An nsfw purity (--purity 111 and friends) needs a wallhaven API key:
        export WALLHAVEN_API_KEY=...
